<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ตารางจัดลำดับงาน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Taviraj:wght@400;500;600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FAF7F0;
    --paper-dim:#F1ECE0;
    --ink:#211F1B;
    --ink-soft:#726C5E;
    --line:#DDD6C5;

    --q1:#AE3A2E; --q1-bg:#F8E9E5; --q1-soft:#FCF3F1;
    --q2:#1F5C4E; --q2-bg:#E7EFEA; --q2-soft:#F1F6F3;
    --q3:#A9761A; --q3-bg:#F6EEDD; --q3-soft:#FAF4E9;
    --q4:#6E695D; --q4-bg:#EEEBE3; --q4-soft:#F5F3ED;

    --radius:10px;
    --shadow:0 1px 2px rgba(33,31,27,.07);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Sarabun',sans-serif;
    font-size:15px;
    line-height:1.5;
    min-height:100vh;
  }
  .app{max-width:920px;margin:0 auto;padding:18px 14px 60px;}

  /* header */
  .top{margin-bottom:14px;}
  .top-row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
  h1{
    font-family:'Taviraj',serif;
    font-weight:600;
    font-size:26px;
    margin:0 0 2px;
    letter-spacing:.2px;
  }
  .sub{color:var(--ink-soft);font-size:13.5px;margin:0;}
  .add-btn{
    flex:0 0 auto;
    background:var(--ink);
    color:var(--paper);
    border:none;
    border-radius:999px;
    padding:10px 16px;
    font-family:'Sarabun',sans-serif;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
    white-space:nowrap;
  }
  .add-btn:active{transform:scale(.97);}

  /* tabs */
  .tabs{
    display:flex;
    gap:4px;
    background:var(--paper-dim);
    border-radius:999px;
    padding:4px;
    margin:16px 0 10px;
    width:fit-content;
  }
  .tab-btn{
    border:none;background:transparent;
    font-family:'Sarabun',sans-serif;
    font-weight:600;font-size:13.5px;
    color:var(--ink-soft);
    padding:7px 16px;
    border-radius:999px;
    cursor:pointer;
  }
  .tab-btn.active{background:var(--ink);color:var(--paper);}

  /* project chips */
  .chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none;}
  .chips::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto;
    border:1px solid var(--line);
    background:#fff;
    color:var(--ink);
    font-size:13px;
    font-weight:500;
    padding:6px 12px;
    border-radius:999px;
    cursor:pointer;
    white-space:nowrap;
  }
  .chip.active{background:var(--ink);border-color:var(--ink);color:var(--paper);}
  .chip.add-chip{color:var(--ink-soft);border-style:dashed;}

  /* banner */
  .banner{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:var(--q3-soft);border:1px solid var(--q3-bg);color:var(--ink);
    border-radius:var(--radius);padding:9px 12px;margin-bottom:10px;font-size:13px;
  }
  .banner button{background:none;border:none;color:var(--ink-soft);font-size:12px;cursor:pointer;text-decoration:underline;font-family:'Sarabun',sans-serif;}

  /* matrix grid */
  .axis-row{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-soft);padding:0 2px 4px;}
  .matrix{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  .quad{
    border-radius:var(--radius);
    padding:10px 9px 12px;
    min-height:160px;
    display:flex;flex-direction:column;
  }
  .quad-1{background:var(--q1-soft);}
  .quad-2{background:var(--q2-soft);}
  .quad-3{background:var(--q3-soft);}
  .quad-4{background:var(--q4-soft);}
  .quad-head{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:8px;
  }
  .quad-title{font-family:'Taviraj',serif;font-weight:600;font-size:14.5px;}
  .quad-1 .quad-title{color:var(--q1);}
  .quad-2 .quad-title{color:var(--q2);}
  .quad-3 .quad-title{color:var(--q3);}
  .quad-4 .quad-title{color:var(--q4);}
  .quad-count{
    font-size:11.5px;font-weight:600;color:var(--ink-soft);
    background:rgba(255,255,255,.7);border-radius:999px;
    padding:1px 8px;
  }
  .quad-list{display:flex;flex-direction:column;gap:6px;flex:1;}
  .quad-empty{color:var(--ink-soft);font-size:12.5px;padding:10px 2px;}

  /* card */
  .card{
    background:#fff;
    border-radius:8px;
    padding:8px 9px;
    box-shadow:var(--shadow);
    cursor:pointer;
  }
  .card-title-row{display:flex;align-items:flex-start;gap:6px;margin-bottom:3px;}
  .card-title{font-size:13.5px;font-weight:600;margin:0;word-break:break-word;flex:1;}
  .est-badge{font-size:10px;color:var(--ink-soft);white-space:nowrap;padding-top:1px;}
  .card-meta{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-bottom:6px;}
  .tag{font-size:10.5px;color:var(--ink-soft);background:var(--paper-dim);padding:1px 7px;border-radius:999px;}
  .due{font-size:11px;font-weight:600;}
  .due.critical,.due.very{color:var(--q1);}
  .due.urgent{color:var(--q3);}
  .due.low,.due.far,.due.none{color:var(--ink-soft);}
  .sub-progress{display:flex;align-items:center;gap:6px;margin-bottom:6px;}
  .sub-bar{flex:1;height:5px;border-radius:999px;background:var(--paper-dim);overflow:hidden;}
  .sub-bar span{display:block;height:100%;background:var(--ink-soft);}
  .sub-label{font-size:10px;color:var(--ink-soft);white-space:nowrap;}
  .card-actions{display:flex;gap:4px;align-items:center;flex-wrap:wrap;}
  .ext-btn{
    border:1px solid var(--line);background:#fff;color:var(--ink-soft);
    font-size:10.5px;font-weight:600;border-radius:999px;padding:2px 7px;cursor:pointer;
  }
  .ext-btn:active{background:var(--paper-dim);}
  .done-btn{
    margin-left:auto;
    width:19px;height:19px;border-radius:50%;
    border:1.5px solid var(--ink-soft);background:#fff;cursor:pointer;flex:0 0 auto;
  }

  /* today view */
  .today-head{margin-bottom:12px;}
  .today-date{font-family:'Taviraj',serif;font-size:19px;font-weight:600;}
  .today-est{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
  .today-list{display:flex;flex-direction:column;gap:7px;}

  /* dashboard */
  .dash-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px;}
  .stat{background:#fff;border-radius:var(--radius);padding:11px 8px;box-shadow:var(--shadow);}
  .stat-num{font-family:'Taviraj',serif;font-size:21px;font-weight:600;}
  .stat-label{font-size:11px;color:var(--ink-soft);}
  .dash-section-title{font-family:'Taviraj',serif;font-size:15.5px;font-weight:600;margin:18px 0 8px;}
  .proj-card{
    background:#fff;border-radius:var(--radius);padding:12px;margin-bottom:9px;
    box-shadow:var(--shadow);cursor:pointer;
  }
  .proj-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:3px;}
  .proj-name{font-family:'Taviraj',serif;font-weight:600;font-size:15.5px;}
  .proj-count{font-size:12px;color:var(--ink-soft);}
  .proj-desc{font-size:12px;color:var(--ink-soft);margin:0 0 8px;}
  .bar{display:flex;height:8px;border-radius:999px;overflow:hidden;background:var(--paper-dim);margin-bottom:7px;}
  .bar span{height:100%;}
  .proj-foot{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-soft);}
  .overdue-badge{color:var(--q1);font-weight:600;}
  .empty-state{color:var(--ink-soft);font-size:13.5px;text-align:center;padding:40px 10px;}
  .analysis-box{background:#fff;border-radius:var(--radius);padding:12px;box-shadow:var(--shadow);margin-bottom:9px;}
  .analysis-item{display:flex;gap:8px;font-size:13px;padding:6px 0;border-bottom:1px solid var(--line);}
  .analysis-item:last-child{border-bottom:none;}
  .analysis-item .dot{flex:0 0 auto;}

  /* modal */
  .overlay{
    position:fixed;inset:0;background:rgba(33,31,27,.4);
    display:none;align-items:flex-end;justify-content:center;z-index:50;
  }
  .overlay.open{display:flex;}
  .sheet{
    background:var(--paper);width:100%;max-width:480px;
    border-radius:16px 16px 0 0;padding:18px 18px 22px;
    max-height:88vh;overflow-y:auto;
  }
  .sheet h2{font-family:'Taviraj',serif;font-size:19px;margin:0 0 14px;}
  .field{margin-bottom:13px;}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;}
  .field input[type=text],.field input[type=date],.field input[type=number],.field select,.field textarea{
    width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;
    font-family:'Sarabun',sans-serif;font-size:14.5px;background:#fff;color:var(--ink);
  }
  .field textarea{resize:vertical;min-height:56px;}
  .row2{display:flex;gap:8px;}
  .row2 .field{flex:1;}
  .seg{display:flex;gap:6px;}
  .seg button{
    flex:1;padding:9px;border-radius:8px;border:1px solid var(--line);
    background:#fff;font-family:'Sarabun',sans-serif;font-weight:600;font-size:13.5px;cursor:pointer;color:var(--ink-soft);
  }
  .seg button.on{background:var(--ink);color:var(--paper);border-color:var(--ink);}
  .sheet-actions{display:flex;gap:8px;margin-top:16px;}
  .btn-primary{flex:1;background:var(--ink);color:var(--paper);border:none;border-radius:8px;padding:11px;font-weight:600;font-size:14.5px;cursor:pointer;font-family:'Sarabun',sans-serif;}
  .btn-ghost{background:none;border:1px solid var(--line);border-radius:8px;padding:11px 14px;font-weight:600;font-size:14.5px;cursor:pointer;color:var(--ink-soft);font-family:'Sarabun',sans-serif;}
  .btn-danger{background:none;border:none;color:var(--q1);font-size:13px;font-weight:600;cursor:pointer;padding:8px 0;}
  .hint{font-size:11.5px;color:var(--ink-soft);margin-top:5px;}

  /* subtasks in sheet */
  .subtask-row{display:flex;align-items:center;gap:7px;padding:6px 0;border-bottom:1px solid var(--line);}
  .subtask-row:last-child{border-bottom:none;}
  .subtask-row input[type=checkbox]{width:16px;height:16px;flex:0 0 auto;}
  .subtask-row .st-title{flex:1;font-size:13.5px;}
  .subtask-row .st-title.done{text-decoration:line-through;color:var(--ink-soft);}
  .st-btn{background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:13px;padding:2px 4px;}
  .add-sub-row{display:flex;gap:6px;margin-top:8px;}
  .add-sub-row input{flex:1;padding:8px 9px;border:1px solid var(--line);border-radius:8px;font-family:'Sarabun',sans-serif;font-size:13.5px;}
  .add-sub-row button{border:none;background:var(--ink);color:var(--paper);border-radius:8px;padding:0 12px;font-weight:600;cursor:pointer;}
  .sub-summary{font-size:12px;color:var(--ink-soft);margin-bottom:6px;}

  .history-list{font-size:12px;color:var(--ink-soft);display:flex;flex-direction:column;gap:4px;max-height:120px;overflow-y:auto;}

  .toast{
    position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:999px;
    font-size:13px;z-index:60;opacity:0;pointer-events:none;transition:opacity .25s;
    display:flex;align-items:center;white-space:nowrap;
  }
  .toast.show{opacity:1;pointer-events:auto;}

  .done-section{margin-top:20px;}
  .done-toggle{font-size:12.5px;color:var(--ink-soft);cursor:pointer;text-decoration:underline;background:none;border:none;padding:0;font-family:'Sarabun',sans-serif;}
  .done-list{margin-top:8px;display:flex;flex-direction:column;gap:6px;}
  .done-list .card{opacity:.6;}
  .done-list .card-title{text-decoration:line-through;}

  @media (max-width:420px){
    .card-title{font-size:12.5px;}
    .quad-title{font-size:13px;}
    h1{font-size:23px;}
    .dash-summary{grid-template-columns:repeat(2,1fr);}
  }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="top">
    <div class="top-row">
      <div>
        <h1>ตารางจัดลำดับงาน</h1>
        <p class="sub">โยนงานเข้าระบบ แล้วให้ระบบช่วยจัดลำดับและขยับให้เองตามเวลา</p>
      </div>
      <button class="add-btn" id="openAdd">+ เพิ่มงาน</button>
    </div>
    <div class="tabs">
      <button class="tab-btn active" data-tab="today">วันนี้</button>
      <button class="tab-btn" data-tab="matrix">ตาราง</button>
      <button class="tab-btn" data-tab="dash">แดชบอร์ด</button>
    </div>
  </div>

  <div id="todayView"></div>
  <div id="matrixView" style="display:none;"></div>
  <div id="dashView" style="display:none;"></div>
</div>

<div class="overlay" id="overlay">
  <div class="sheet" id="sheet"></div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  const THAI_MONTHS=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
  const THAI_DAYS=['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
  const STORAGE_KEY='matrix-data-v2';
  const DAILY_CAPACITY_HOURS=8;

  let tasks=[];
  let projects=[];       // array of names
  let projectMeta={};    // name -> {description}
  let currentTab='today';
  let currentProject='all';
  let showDone=false;
  let editingId=null;
  let sheetSubtasks=[];
  let sheetStatus='todo';
  let movedBanner=0;
  let bannerDismissed=false;

  const $ = sel => document.querySelector(sel);
  const app = $('#app');

  function uid(){ return 'id-'+Math.random().toString(36).slice(2,10)+Date.now().toString(36); }
  function nowStamp(){ return Date.now(); }

  function toDateOnly(d){ return new Date(d.getFullYear(),d.getMonth(),d.getDate()); }
  function daysUntil(dateStr){
    if(!dateStr) return null;
    const today=toDateOnly(new Date());
    const due=toDateOnly(new Date(dateStr+'T00:00:00'));
    return Math.round((due-today)/86400000);
  }
  function formatDate(dateStr){
    const d=new Date(dateStr+'T00:00:00');
    return d.getDate()+' '+THAI_MONTHS[d.getMonth()];
  }
  function bucketInfo(days){
    if(days===null) return {text:'ไม่มีกำหนด', cls:'none'};
    if(days<0) return {text:'เลยกำหนด '+Math.abs(days)+' วัน', cls:'critical'};
    if(days===0) return {text:'ครบกำหนดวันนี้', cls:'critical'};
    if(days<3) return {text:(days===1?'พรุ่งนี้':'อีก '+days+' วัน')+' · ด่วนมาก', cls:'very'};
    if(days<=7) return {text:'อีก '+days+' วัน · ด่วน', cls:'urgent'};
    if(days<=14) return {text:'อีก '+days+' วัน', cls:'low'};
    return {text:'อีก '+days+' วัน', cls:'far'};
  }
  function formatEst(min){
    if(!min) return '';
    if(min<60) return '~'+min+' นาที';
    const h=min/60;
    return '~'+(h%1===0?h:h.toFixed(1))+' ชม.';
  }

  // urgent axis: due within 7 days or overdue. importance escalates when <3 days or overdue.
  function isUrgent(task){
    const d=daysUntil(task.due);
    return d!==null && d<=7;
  }
  function isImportantEffective(task){
    const d=daysUntil(task.due);
    return !!task.important || (d!==null && d<3);
  }
  function classify(task){
    const urgent=isUrgent(task), important=isImportantEffective(task);
    if(important && urgent) return 1;
    if(important && !urgent) return 2;
    if(!important && urgent) return 3;
    return 4;
  }
  const QUAD_INFO={
    1:{label:'สำคัญ · ด่วน', hint:'ทำเลยตอนนี้'},
    2:{label:'สำคัญ · ไม่ด่วน', hint:'วางแผนไว้ล่วงหน้า'},
    3:{label:'ไม่สำคัญ · ด่วน', hint:'รีบจบหรือมอบหมาย'},
    4:{label:'ไม่สำคัญ · ไม่ด่วน', hint:'พักไว้ก่อนได้'}
  };

  function subtaskProgress(t){
    if(!t.subtasks || !t.subtasks.length) return null;
    const done=t.subtasks.filter(s=>s.done).length;
    return {done, total:t.subtasks.length};
  }

  // ---------- storage (browser localStorage — data stays on this device/browser) ----------
  function loadData(){
    try{
      const raw = window.localStorage.getItem(STORAGE_KEY);
      if(raw){
        const parsed=JSON.parse(raw);
        tasks=parsed.tasks||[];
        projects=parsed.projects||[];
        projectMeta=parsed.projectMeta||{};
      }
    }catch(e){ console.warn('load failed',e); }
  }
  function saveData(){
    try{
      window.localStorage.setItem(STORAGE_KEY, JSON.stringify({tasks,projects,projectMeta}));
    }catch(e){
      console.warn('save failed',e);
      showToast('บันทึกไม่สำเร็จ ลองใหม่อีกครั้ง');
    }
  }

  let toastTimer=null;
  function showToast(msg, undoFn){
    const t=$('#toast');
    t.innerHTML = escapeHtml(msg) + (undoFn? ' <button id="toastUndoBtn" style="margin-left:8px;background:none;border:1px solid rgba(255,255,255,.4);color:inherit;border-radius:999px;padding:2px 9px;font-size:12px;cursor:pointer;font-family:Sarabun,sans-serif;">เลิกทำ</button>':'');
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer=setTimeout(()=>t.classList.remove('show'), undoFn?4500:2200);
    if(undoFn){
      const b=document.getElementById('toastUndoBtn');
      if(b) b.addEventListener('click', ()=>{ undoFn(); t.classList.remove('show'); });
    }
  }

  function allProjectNames(){
    const set=new Set(projects);
    tasks.forEach(t=>{ if(t.project) set.add(t.project); });
    return Array.from(set);
  }

  // ---------- auto-move detection (runs once per load) ----------
  function recomputeAutoMoves(){
    let moved=0;
    let changed=false;
    tasks.forEach(t=>{
      if(t.done) return;
      const q=classify(t);
      if(t.lastQuadrant===undefined || t.lastQuadrant===null){
        t.lastQuadrant=q;
        changed=true;
      } else if(t.lastQuadrant!==q){
        t.history = t.history||[];
        t.history.push({type:'auto_moved', at:nowStamp(), from:QUAD_INFO[t.lastQuadrant].label, to:QUAD_INFO[q].label});
        t.lastQuadrant=q;
        moved++;
        changed=true;
      }
    });
    if(changed) saveData();
    movedBanner=moved;
  }

  // ---------- render: today ----------
  function renderToday(){
    const view=$('#todayView');
    const active=tasks.filter(t=>!t.done);
    const todays = active.filter(t=>{
      const d=daysUntil(t.due);
      return (d!==null && d<=0) || classify(t)===1;
    }).sort((a,b)=>{
      const da=daysUntil(a.due), db=daysUntil(b.due);
      if(da===null) return 1;
      if(db===null) return -1;
      return da-db;
    });
    const totalMin = todays.reduce((s,t)=> s+(t.estMinutes||0), 0);
    const d=new Date();
    const dateStr = THAI_DAYS[d.getDay()]+' '+d.getDate()+' '+THAI_MONTHS[d.getMonth()];

    view.innerHTML = `
      <div class="today-head">
        <div class="today-date">${dateStr}</div>
        ${totalMin? `<div class="today-est">งานที่ควรสนใจวันนี้รวม ${formatEst(totalMin).replace('~','')} โดยประมาณ</div>` : ''}
      </div>
      <div class="today-list">
        ${todays.length? todays.map(cardHtml).join('') : `<div class="empty-state">วันนี้ไม่มีงานเร่งด่วน — เลือกทำงานจากช่อง "สำคัญ · ไม่ด่วน" ในตารางได้เลย</div>`}
      </div>
    `;
  }

  // ---------- render: matrix ----------
  function renderMatrix(){
    const view=$('#matrixView');
    const names=allProjectNames();
    const visibleTasks = tasks.filter(t=> currentProject==='all' || t.project===currentProject );
    const active=visibleTasks.filter(t=>!t.done);
    const done=visibleTasks.filter(t=>t.done);

    const groups={1:[],2:[],3:[],4:[]};
    active.forEach(t=> groups[classify(t)].push(t) );
    Object.values(groups).forEach(list=> list.sort((a,b)=>{
      const da=daysUntil(a.due), db=daysUntil(b.due);
      if(da===null) return 1;
      if(db===null) return -1;
      return da-db;
    }));

    const chipsHtml = `<div class="chips">
      <button class="chip ${currentProject==='all'?'active':''}" data-proj="all">ทั้งหมด</button>
      ${names.map(n=>`<button class="chip ${currentProject===n?'active':''}" data-proj="${escapeAttr(n)}">${escapeHtml(n)} <span style="opacity:.6">(${tasks.filter(t=>t.project===n && !t.done).length})</span></button>`).join('')}
      <button class="chip add-chip" id="addProjChip">+ โปรเจกต์</button>
    </div>`;

    const bannerHtml = (movedBanner>0 && !bannerDismissed) ? `<div class="banner">
      <span>${movedBanner} งานขยับช่องอัตโนมัติตามเวลาที่เหลือ</span>
      <button id="dismissBanner">ปิด</button>
    </div>` : '';

    const quadHtml = [1,2,3,4].map(q=>{
      const list=groups[q];
      return `<div class="quad quad-${q}">
        <div class="quad-head">
          <div class="quad-title">${QUAD_INFO[q].label}</div>
          <div class="quad-count">${list.length}</div>
        </div>
        <div class="quad-list">
          ${list.length? list.map(cardHtml).join('') : `<div class="quad-empty">${QUAD_INFO[q].hint} — ยังไม่มีงาน</div>`}
        </div>
      </div>`;
    }).join('');

    const doneHtml = `<div class="done-section">
      <button class="done-toggle" id="toggleDone">${showDone?'ซ่อน':'แสดง'}งานที่เสร็จแล้ว (${done.length})</button>
      ${showDone ? `<div class="done-list">${done.length? done.map(cardHtml).join(''):'<div class="quad-empty">ยังไม่มีงานที่เสร็จ</div>'}</div>` : ''}
    </div>`;

    view.innerHTML = `
      ${chipsHtml}
      ${bannerHtml}
      <div class="axis-row"><span>ด่วนกว่า ← → ไกลออกไป</span></div>
      <div class="matrix">${quadHtml}</div>
      ${doneHtml}
    `;
  }

  function cardHtml(t){
    const d=daysUntil(t.due);
    const b=bucketInfo(d);
    const prog=subtaskProgress(t);
    return `<div class="card" data-id="${t.id}">
      <div class="card-title-row">
        <p class="card-title">${escapeHtml(t.title)}</p>
        ${t.estMinutes? `<span class="est-badge">${formatEst(t.estMinutes)}</span>`:''}
      </div>
      <div class="card-meta">
        ${t.project?`<span class="tag">${escapeHtml(t.project)}</span>`:''}
        <span class="due ${b.cls}">${b.text}${t.due?' · '+formatDate(t.due):''}</span>
      </div>
      ${prog? `<div class="sub-progress"><div class="sub-bar"><span style="width:${prog.done/prog.total*100}%"></span></div><span class="sub-label">${prog.done}/${prog.total}</span></div>`:''}
      <div class="card-actions">
        ${t.due && !t.done ? `
          <button class="ext-btn" data-ext="1" data-id="${t.id}">+1 วัน</button>
          <button class="ext-btn" data-ext="3" data-id="${t.id}">+3 วัน</button>
          <button class="ext-btn" data-ext="7" data-id="${t.id}">+7 วัน</button>
        `: ''}
        <button class="done-btn" data-done="${t.id}" title="${t.done?'ทำเครื่องหมายว่ายังไม่เสร็จ':'ทำเสร็จแล้ว'}" style="${t.done?'background:var(--ink-soft);':''}"></button>
      </div>
    </div>`;
  }

  // ---------- render: dashboard ----------
  function renderDash(){
    const view=$('#dashView');
    const names=allProjectNames();
    const active=tasks.filter(t=>!t.done);
    const overdue=active.filter(t=>{const d=daysUntil(t.due); return d!==null && d<0;});
    const urgent=active.filter(isUrgent);
    const important=active.filter(isImportantEffective);
    const completed=tasks.filter(t=>t.done);
    const extended=tasks.filter(t=> (t.history||[]).some(h=>h.type==='extend'));

    const summary=`<div class="dash-summary">
      <div class="stat"><div class="stat-num">${active.length}</div><div class="stat-label">งานทั้งหมด</div></div>
      <div class="stat"><div class="stat-num" style="color:var(--q3)">${urgent.length}</div><div class="stat-label">ด่วน</div></div>
      <div class="stat"><div class="stat-num" style="color:var(--q2)">${important.length}</div><div class="stat-label">สำคัญ</div></div>
      <div class="stat"><div class="stat-num">${completed.length}</div><div class="stat-label">เสร็จแล้ว</div></div>
      <div class="stat"><div class="stat-num" style="color:var(--q1)">${overdue.length}</div><div class="stat-label">เกินกำหนด</div></div>
      <div class="stat"><div class="stat-num">${extended.length}</div><div class="stat-label">เคย extend</div></div>
    </div>`;

    // system analysis
    const analysis=[];
    if(names.length>=2 && active.length>=4){
      const byProj={};
      active.forEach(t=>{ const p=t.project||'ไม่ระบุโปรเจกต์'; byProj[p]=(byProj[p]||0)+1; });
      const sorted=Object.entries(byProj).sort((a,b)=>b[1]-a[1]);
      if(sorted[0] && sorted[0][1]/active.length>0.6){
        analysis.push({dot:'q3', text:`งานของคุณกระจุกตัวอยู่ที่ "${sorted[0][0]}" (${Math.round(sorted[0][1]/active.length*100)}% ของงานค้างทั้งหมด)`});
      }
    }
    const soonUrgent = active.filter(t=>{ const d=daysUntil(t.due); return d!==null && d>=3 && d<=5; });
    if(soonUrgent.length){
      analysis.push({dot:'q3', text:`${soonUrgent.length} งานจะกลายเป็นงานด่วนภายใน 3 วันข้างหน้า`});
    }
    if(extended.length){
      analysis.push({dot:'q4', text:`มี ${extended.length} งานที่เคยถูกเลื่อนกำหนดอย่างน้อย 1 ครั้ง`});
    }
    const dueTodayTasks = active.filter(t=>{ const d=daysUntil(t.due); return d!==null && d<=0; });
    const hoursNeeded = dueTodayTasks.reduce((s,t)=>s+(t.estMinutes||0),0)/60;
    if(hoursNeeded>DAILY_CAPACITY_HOURS){
      analysis.push({dot:'q1', text:`งานที่ครบกำหนดวันนี้/เกินกำหนดรวมประมาณ ${hoursNeeded.toFixed(1)} ชม. แต่เวลาทำงานที่มักมีต่อวันอยู่ที่ราว ${DAILY_CAPACITY_HOURS} ชม. — ลองพิจารณา extend งานที่ไม่สำคัญเท่าที่เหลือ`});
    }
    if(overdue.length){
      analysis.push({dot:'q1', text:`มี ${overdue.length} งานเกินกำหนดแล้ว ควรจัดการหรือเลื่อนกำหนดก่อนงานอื่น`});
    }

    const analysisHtml = `<div class="dash-section-title">ภาพรวมของระบบ</div>
      <div class="analysis-box">
        ${analysis.length? analysis.map(a=>`<div class="analysis-item"><span class="dot">${a.dot==='q1'?'⚠️':'💡'}</span><span>${a.text}</span></div>`).join('') : '<div class="analysis-item"><span>✅</span><span>งานของคุณดูสมดุลดี ไม่มีจุดที่น่ากังวลตอนนี้</span></div>'}
      </div>`;

    if(names.length===0){
      view.innerHTML = summary + `<div class="empty-state">ยังไม่มีโปรเจกต์ — เพิ่มงานแรกเพื่อเริ่มเห็นภาพรวม</div>`;
      return;
    }

    const rows = names.map(name=>{
      const pt = tasks.filter(t=>t.project===name);
      const pa = pt.filter(t=>!t.done);
      const pd = pt.filter(t=>t.done);
      const pOverdue = pa.filter(t=>{const d=daysUntil(t.due); return d!==null && d<0;}).length;
      const counts={1:0,2:0,3:0,4:0};
      pa.forEach(t=> counts[classify(t)]++ );
      const total = pa.length || 1;
      const bar = [1,2,3,4].map(q=>{
        const pct = (counts[q]/total*100);
        if(!pct) return '';
        const color = q===1?'var(--q1)':q===2?'var(--q2)':q===3?'var(--q3)':'var(--q4)';
        return `<span style="width:${pct}%;background:${color}"></span>`;
      }).join('');
      const upcoming = pa.filter(t=>t.due).sort((a,b)=>daysUntil(a.due)-daysUntil(b.due))[0];
      const progressPct = pt.length? Math.round(pd.length/pt.length*100) : 0;
      const desc = projectMeta[name] && projectMeta[name].description;
      return `<div class="proj-card" data-proj="${escapeAttr(name)}">
        <div class="proj-top">
          <span class="proj-name">${escapeHtml(name)}</span>
          <span class="proj-count">${progressPct}%</span>
        </div>
        ${desc? `<p class="proj-desc">${escapeHtml(desc)}</p>`:''}
        <div class="bar">${bar || '<span style="width:100%;background:var(--line)"></span>'}</div>
        <div class="proj-foot">
          <span>${pd.length} / ${pt.length} เสร็จแล้ว</span>
          <span>${upcoming? 'ใกล้สุด: '+formatDate(upcoming.due) : 'ไม่มีกำหนด'}</span>
        </div>
        ${pOverdue>0? `<div class="proj-foot" style="margin-top:4px;"><span class="overdue-badge">เกินกำหนด ${pOverdue} งาน</span><span>ดูในตาราง →</span></div>`:''}
      </div>`;
    }).join('');

    view.innerHTML = summary + analysisHtml + `<div class="dash-section-title">โปรเจกต์</div>` + rows;
  }

  // ---------- add/edit sheet ----------
  function openAddSheet(taskId){

        <label>ชื่องาน</label>

        <label>โปรเจกต์</label>
        <select id="fProjectSelect">

      </div>
      <div class="field">
        <label>รายละเอียด / โน้ต</label>
        <textarea id="fDesc" placeholder="รายละเอียดเพิ่มเติม (ไม่บังคับ)">${t?escapeHtml(t.description||''):''}</textarea>
      </div>
      <div class="row2">
        <div class="field">
          <label>วันครบกำหนด</label>
          <input type="date" id="fDue" value="${t?t.due||'':''}">
        </div>
        <div class="field">
          <label>เวลาโดยประมาณ (ชม.)</label>
          <input type="number" id="fEst" step="0.5" min="0" value="${t&&t.estMinutes?(t.estMinutes/60):''}" placeholder="เช่น 2">
        </div>
      </div>
      <div class="field">
        <label>ความสำคัญ</label>
        <div class="seg">
          <button type="button" data-imp="1" class="${t&&t.important?'on':''}">สำคัญ</button>
          <button type="button" data-imp="0" class="${!(t&&t.important)?'on':''}">ไม่สำคัญ</button>
        </div>
        <div class="hint">ระบบขยับให้อัตโนมัติ: เหลือ ≤7 วันถือว่าด่วน และเหลือ &lt;3 วันหรือเกินกำหนดจะถือว่าสำคัญเสมอ</div>
      </div>
      <div class="field">
        <label>สถานะ</label>
        <select id="fStatus">
          <option value="todo" ${sheetStatus==='todo'?'selected':''}>ยังไม่เริ่ม</option>
          <option value="in_progress" ${sheetStatus==='in_progress'?'selected':''}>กำลังทำ</option>
          <option value="done" ${sheetStatus==='done'?'selected':''}>เสร็จแล้ว</option>
        </select>
      </div>
      <div class="field">
        <label>Subtasks</label>
        <div id="subSummary" class="sub-summary"></div>
        <div id="subtaskContainer"></div>
        <div class="add-sub-row">
          <input type="text" id="fNewSub" placeholder="เพิ่ม subtask แล้วกด Enter">
          <button type="button" id="addSubBtn">เพิ่ม</button>
        </div>
      </div>
      ${t && t.history && t.history.length ? `
      <div class="field">
        <label>ประวัติ</label>
        <div class="history-list">${t.history.slice().reverse().map(historyLine).join('')}</div>
      </div>` : ''}
      <div class="sheet-actions">
        <button class="btn-ghost" id="cancelSheet">ยกเลิก</button>
        <button class="btn-primary" id="saveSheet">${t?'บันทึก':'เพิ่มงาน'}</button>
      </div>
      ${t?`<button class="btn-danger" id="deleteTask">ลบงานนี้</button>`:''}

    renderSubtaskEditor();

    $('#sheet').querySelectorAll('[data-imp]').forEach(b=>{
      b.addEventListener('click',()=>{
        $('#sheet').querySelectorAll('[data-imp]').forEach(x=>x.classList.remove('on'));
        b.classList.add('on');
      });
    });
    $('#fProjectSelect').addEventListener('change', e=>{
      $('#fProjectNew').style.display = e.target.value==='__new__' ? 'block':'none';

      $('#fProjectNew').style.display='block';
      $('#fProjectNew').value=t.project;

    $('#addSubBtn').addEventListener('click', addSubtaskFromInput);
    $('#fNewSub').addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); addSubtaskFromInput(); } });

    $('#saveSheet').addEventListener('click', ()=>{
      const title = $('#fTitle').value.trim();
      if(!title){ showToast('ใส่ชื่องานก่อนนะ'); return; }
      let project = $('#fProjectSelect').value;
      if(project==='__new__'){
        project = $('#fProjectNew').value.trim();
        if(project && !projects.includes(project)) projects.push(project);
      }
      const due = $('#fDue').value || null;
      const impOn = $('#sheet').querySelector('[data-imp].on');
      const important = impOn ? impOn.dataset.imp==='1' : false;
      const estHours = parseFloat($('#fEst').value);
      const estMinutes = isNaN(estHours) ? null : Math.round(estHours*60);
      const description = $('#fDesc').value.trim();
      const status = $('#fStatus').value;
      const doneNow = status==='done' || (sheetSubtasks.length>0 && sheetSubtasks.every(s=>s.done));

      if(editingId){
        const task = tasks.find(x=>x.id===editingId);
        if(task.due!==due && due && task.due){
          task.history = task.history||[];
          task.history.push({type:'deadline_changed', at:nowStamp(), from:task.due, to:due});
        }
        if(!!task.important!==important){
          task.history = task.history||[];
          task.history.push({type:'importance_changed', at:nowStamp(), from:task.important?'สำคัญ':'ไม่สำคัญ', to:important?'สำคัญ':'ไม่สำคัญ'});
        }
        task.title=title; task.project=project||''; task.due=due; task.important=important;
        task.description=description; task.estMinutes=estMinutes; task.status=status;
        task.subtasks=sheetSubtasks; task.done=doneNow;
        task.lastQuadrant=classify(task);
      }else{
        const newTask={id:uid(), title, project:project||'', due, important, description,
          estMinutes, status, done:doneNow, subtasks:sheetSubtasks, createdAt:nowStamp(),
          history:[{type:'created', at:nowStamp()}]};
        newTask.lastQuadrant=classify(newTask);
        tasks.push(newTask);
      }
      saveData();
      closeSheet();
      renderAll();
    });
    if(t){
      $('#deleteTask').addEventListener('click', ()=>{
        tasks = tasks.filter(x=>x.id!==editingId);
        saveData();
        closeSheet();
        renderAll();
      });
    }
    $('#overlay').classList.add('open');
  }

  function historyLine(h){
    const d=new Date(h.at);
    const dateTxt=d.getDate()+' '+THAI_MONTHS[d.getMonth()];
    let text='';
    if(h.type==='created') text='สร้างงาน';
    else if(h.type==='extend') text=`เลื่อนกำหนด +${h.days} วัน (${formatDate(h.from)} → ${formatDate(h.to)})`;
    else if(h.type==='deadline_changed') text=`เปลี่ยนกำหนดจาก ${formatDate(h.from)} → ${formatDate(h.to)}`;
    else if(h.type==='importance_changed') text=`เปลี่ยนความสำคัญ: ${h.from} → ${h.to}`;
    else if(h.type==='auto_moved') text=`ขยับอัตโนมัติ: ${h.from} → ${h.to}`;
    else text=h.type;
    return `<div>${dateTxt} — ${escapeHtml(text)}</div>`;
  }

  function addSubtaskFromInput(){
    const input=$('#fNewSub');
    const title=input.value.trim();
    if(!title) return;
    sheetSubtasks.push({id:uid(), title, done:false});
    input.value='';
    renderSubtaskEditor();
  }
  function renderSubtaskEditor(){
    const doneCount=sheetSubtasks.filter(s=>s.done).length;
    $('#subSummary').textContent = sheetSubtasks.length? `${doneCount} / ${sheetSubtasks.length} เสร็จแล้ว` : 'ยังไม่มี subtask';
    $('#subtaskContainer').innerHTML = sheetSubtasks.map((s,i)=>`
      <div class="subtask-row" data-idx="${i}">
        <input type="checkbox" data-sub-toggle="${i}" ${s.done?'checked':''}>
        <span class="st-title ${s.done?'done':''}">${escapeHtml(s.title)}</span>
        <button type="button" class="st-btn" data-sub-up="${i}" ${i===0?'disabled style="opacity:.3;"':''}>↑</button>
        <button type="button" class="st-btn" data-sub-down="${i}" ${i===sheetSubtasks.length-1?'disabled style="opacity:.3;"':''}>↓</button>
        <button type="button" class="st-btn" data-sub-del="${i}">✕</button>
      </div>
    `).join('');
    $('#subtaskContainer').querySelectorAll('[data-sub-toggle]').forEach(cb=>{
      cb.addEventListener('change', ()=>{
        const i=+cb.dataset.subToggle;
        sheetSubtasks[i].done=cb.checked;
        renderSubtaskEditor();
      });
    });
    $('#subtaskContainer').querySelectorAll('[data-sub-del]').forEach(b=>{
      b.addEventListener('click', ()=>{ sheetSubtasks.splice(+b.dataset.subDel,1); renderSubtaskEditor(); });
    });
    $('#subtaskContainer').querySelectorAll('[data-sub-up]').forEach(b=>{
      b.addEventListener('click', ()=>{
        const i=+b.dataset.subUp;
        if(i>0){ [sheetSubtasks[i-1],sheetSubtasks[i]]=[sheetSubtasks[i],sheetSubtasks[i-1]]; renderSubtaskEditor(); }
      });
    });
    $('#subtaskContainer').querySelectorAll('[data-sub-down]').forEach(b=>{
      b.addEventListener('click', ()=>{
        const i=+b.dataset.subDown;
        if(i<sheetSubtasks.length-1){ [sheetSubtasks[i+1],sheetSubtasks[i]]=[sheetSubtasks[i],sheetSubtasks[i+1]]; renderSubtaskEditor(); }
      });
    });
  }

  // ---------- helpers ----------
  function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function escapeAttr(s){ return escapeHtml(s); }

  function extendDue(id, days){
    const t=tasks.find(x=>x.id===id);
    if(!t || !t.due) return;
    const prevDue=t.due;
    const d=new Date(t.due+'T00:00:00');
    d.setDate(d.getDate()+days);
    const newDue = d.toISOString().slice(0,10);
    t.due = newDue;
    t.history = t.history||[];
    t.history.push({type:'extend', at:nowStamp(), days, from:prevDue, to:newDue});
    t.lastQuadrant = classify(t);
    saveData();
    renderAll();
    showToast('เลื่อนกำหนดออกไป '+days+' วันแล้ว', ()=>{
      t.due = prevDue;
      const idx=t.history.map(h=>h.type).lastIndexOf('extend');
      if(idx>-1) t.history.splice(idx,1);
      t.lastQuadrant = classify(t);
      saveData();
      renderAll();
      showToast('ยกเลิกการเลื่อนกำหนดแล้ว');
    });
  }
  function toggleDoneTask(id){
    const t=tasks.find(x=>x.id===id);
    if(!t) return;
    if(!t.done && t.subtasks && t.subtasks.length && t.subtasks.some(s=>!s.done)){
      const remaining=t.subtasks.filter(s=>!s.done).length;
      showToast(`ยังมี subtask ค้าง ${remaining} รายการ`);
      return;
    }
    t.done = !t.done;
    t.status = t.done ? 'done' : 'todo';
    saveData();
    renderAll();
  }

  // ---------- events (delegation) ----------
  app.addEventListener('click', e=>{
    const tabBtn = e.target.closest('.tab-btn');
    if(tabBtn){
      currentTab = tabBtn.dataset.tab;
      document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b===tabBtn));
      $('#todayView').style.display = currentTab==='today' ? '' : 'none';
      $('#matrixView').style.display = currentTab==='matrix' ? '' : 'none';
      $('#dashView').style.display = currentTab==='dash' ? '' : 'none';
      if(currentTab==='dash') renderDash();
      if(currentTab==='today') renderToday();
      return;
    }
    const chip = e.target.closest('.chip[data-proj]');
    if(chip){
      currentProject = chip.dataset.proj;
      renderMatrix();
      return;
    }
    if(e.target.closest('#addProjChip')){ openAddProject(); return; }
    if(e.target.closest('#dismissBanner')){ bannerDismissed=true; renderMatrix(); return; }
    const projCard = e.target.closest('.proj-card');
    if(projCard){
      currentProject = projCard.dataset.proj;
      currentTab='matrix';
      document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab==='matrix'));
      $('#todayView').style.display='none';
      $('#matrixView').style.display='';
      $('#dashView').style.display='none';
      renderMatrix();
      return;
    }
    const extBtn = e.target.closest('.ext-btn');
    if(extBtn){
      extendDue(extBtn.dataset.id, +extBtn.dataset.ext);
      return;
    }
    const doneBtn = e.target.closest('.done-btn');
    if(doneBtn){
      toggleDoneTask(doneBtn.dataset.done);
      return;
    }
    if(e.target.closest('#toggleDone')){
      showDone = !showDone;
      renderMatrix();
      return;
    }
    const card = e.target.closest('.card');
    if(card){
      openAddSheet(card.dataset.id);
      return;
    }
  });
  $('#openAdd').addEventListener('click', ()=>openAddSheet(null));
  $('#overlay').addEventListener('click', e=>{ if(e.target.id==='overlay') closeSheet(); });

  function renderAll(){
    if(currentTab==='today') renderToday();
    else if(currentTab==='matrix') renderMatrix();
    else renderDash();
    // keep the hidden views reasonably fresh too
    if(currentTab!=='matrix') renderMatrix();
    if(currentTab!=='dash') renderDash();
  }

  function init(){
    loadData();
    recomputeAutoMoves();
    renderToday();
    renderMatrix();
    renderDash();
  }
  init();
})();
</script>
</body>
</html>
